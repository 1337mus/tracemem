[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemem"
version = "0.1.0"
description = "Local evidence-grounded conversational memory research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
tracemem = "tracemem.cli:main"

[project.optional-dependencies]
dev = ["mypy==1.19.1", "ruff==0.15.0"]
semantic = ["sentence-transformers>=3.0,<6"]
modal = ["modal==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracemem = ["data/*.json"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/tracemem", "training", "experiments/modal_sft.py", "experiments/sft_launch.py",
    "experiments/quote_verifier.py", "experiments/quote_verifier_payload.py",
    "experiments/modal_quote_verifier.py", "experiments/evaluate_quote_verifier.py",
    "experiments/verifier_pairs.py", "experiments/modal_verifier_pairs.py",
    "experiments/evaluate_verifier_pairs.py",
]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
