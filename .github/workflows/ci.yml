name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 checks and installed smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked development and Modal dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock -r requirements-modal.lock

      - name: Run checks
        run: |
          set -euo pipefail
          make check PYTHON=.venv/bin/python

      - name: Build wheel
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/tracemem-wheel"
          mkdir -p "$wheel_dir"
          .venv/bin/python -m pip wheel \
            --no-build-isolation \
            --no-deps \
            --wheel-dir "$wheel_dir" \
            .

      - name: Test installed wheel outside the checkout
        run: |
          set -euo pipefail
          wheel="$(find "$RUNNER_TEMP/tracemem-wheel" -maxdepth 1 -type f -name 'tracemem-*.whl' -print -quit)"
          test -n "$wheel"

          smoke_venv="$RUNNER_TEMP/tracemem-smoke-venv"
          .venv/bin/python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --no-deps "$wheel"

          test_root="$(mktemp -d "$RUNNER_TEMP/tracemem-installed-tests.XXXXXX")"
          test_dir="$test_root/tests"
          mkdir -p "$test_dir" "$test_root/examples/synthetic" "$test_root/experiments"
          cp tests/test_chatgpt_adapter.py tests/test_chatgpt_snapshot.py \
            tests/test_adapter.py tests/test_transcript_bounds.py tests/test_transcript_consistency.py \
            tests/test_longmemeval_adapter.py tests/test_longmemeval_retrieval.py \
            tests/test_longmemeval_file.py tests/test_longmemeval_selection.py \
            tests/test_retention.py tests/test_retention_report.py tests/test_synthetic_qa.py \
            tests/test_modal_synthetic_qa.py tests/test_synthetic_qa_analysis.py \
            tests/test_token_budget.py tests/test_token_catalog.py "$test_dir/"
          cp tests/test_modal_token_count.py "$test_dir/"
          cp tests/test_qa_contrast.py "$test_dir/"
          cp tests/test_modal_qa_contrast_token_count.py "$test_dir/"
          cp tests/test_modal_qa_contrast_answer.py "$test_dir/"
          cp tests/test_qa_contrast_answer_analysis.py "$test_dir/"
          cp tests/test_qa_contrast_reviews.py "$test_dir/"
          cp tests/test_qa_contrast_review_analysis.py "$test_dir/"
          cp tests/test_qa_contrast_token_replay.py "$test_dir/"
          cp tests/test_qa_contrast_requests.py "$test_dir/"
          cp tests/test_qa_interpretation_controls.py "$test_dir/"
          cp tests/test_qa_interpretation_answer_receipt.py "$test_dir/"
          cp tests/test_modal_qa_interpretation_answer.py "$test_dir/"
          cp examples/synthetic/longmemeval-format.json examples/synthetic/qa-diagnostic-v1.json "$test_root/examples/synthetic/"
          cp examples/synthetic/qa-contrast-dev-v1.json "$test_root/examples/synthetic/"
          cp examples/synthetic/qa-interpretation-controls-dev-v1.json "$test_root/examples/synthetic/"
          cp examples/synthetic/qwen3-4b-qa-contrast-token-count-remote.json "$test_root/examples/synthetic/"
          cp examples/synthetic/qwen3-4b-qa-contrast-answer-remote.json "$test_root/examples/synthetic/"
          cp docs/qa-contrast-answer-dev.json "$test_root/qa-contrast-answer-expected.json"
          cp experiments/evaluate_longmemeval_retrieval.py experiments/prepare_synthetic_qa.py \
            experiments/modal_synthetic_qa.py experiments/analyze_synthetic_qa.py \
            experiments/scenario_payload.py experiments/token_catalog.py "$test_root/experiments/"
          cp experiments/modal_token_count.py "$test_root/experiments/"
          cp experiments/prepare_qa_contrast.py "$test_root/experiments/"
          cp experiments/modal_qa_contrast_token_count.py "$test_root/experiments/"
          cp experiments/modal_qa_contrast_answer.py "$test_root/experiments/"
          cp experiments/qa_contrast_answer_receipt.py "$test_root/experiments/"
          cp experiments/analyze_qa_contrast_answers.py "$test_root/experiments/"
          cp experiments/prepare_qa_contrast_reviews.py "$test_root/experiments/"
          cp experiments/analyze_qa_contrast_reviews.py "$test_root/experiments/"
          cp experiments/replay_qa_contrast_tokens.py "$test_root/experiments/"
          cp experiments/prepare_qa_contrast_requests.py "$test_root/experiments/"
          cp experiments/prepare_qa_interpretation_controls.py "$test_root/experiments/"
          cp experiments/qa_interpretation_answer_receipt.py "$test_root/experiments/"
          cp experiments/modal_qa_interpretation_answer.py "$test_root/experiments/"

          unset PYTHONPATH PYTHONHOME
          work_dir="$("$smoke_venv/bin/python" -c 'import tempfile; print(tempfile.mkdtemp(prefix="tracemem-smoke-work-"))')"
          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/tracemem" demo
          "$smoke_venv/bin/python" -m tracemem demo
          "$smoke_venv/bin/python" "$GITHUB_WORKSPACE/experiments/smoke_installed.py" \
            --source-root "$GITHUB_WORKSPACE" \
            --work-dir "$work_dir"
          cd "$test_root"
          "$smoke_venv/bin/python" -m unittest discover \
            -s "$test_dir" \
            -p 'test_*.py' \
            -v
          "$smoke_venv/bin/python" -m experiments.analyze_qa_contrast_answers \
            examples/synthetic/qwen3-4b-qa-contrast-answer-remote.json \
            --output qa-contrast-answer-actual.json
          cmp qa-contrast-answer-expected.json qa-contrast-answer-actual.json
