<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Current TraceMem architecture</title>
  <desc id="desc">Conversation sources flow into SQLite, then through search to cited passages fitted to a chosen size limit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9 Z" fill="#168C91"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 29px; font-weight: 700; fill: #14243A; }
      .subtitle { font-size: 18px; fill: #53657A; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 1.1px; fill: #55708C; }
      .card-title { font-size: 22px; font-weight: 700; fill: #162A42; }
      .body { font-size: 18px; fill: #40546B; }
      .foot { font-size: 18px; fill: #667A90; }
    </style>
  </defs>
  <rect width="1200" height="390" rx="24" fill="#F4F8FC"/>
  <text class="sans title" x="40" y="49">Current architecture</text>
  <text class="sans subtitle" x="40" y="78">Local search keeps every result connected to its source conversation.</text>

  <g fill="none" stroke="#168C91" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M220 220 H256"/>
    <path d="M460 220 H496"/>
    <path d="M700 220 H736"/>
    <path d="M940 220 H976"/>
  </g>

  <g class="sans">
    <g>
      <rect x="24" y="110" width="196" height="224" rx="18" fill="#FFFFFF" stroke="#CFDCEB" stroke-width="1.5"/>
      <rect x="24" y="110" width="196" height="7" rx="3.5" fill="#4A78B8"/>
      <text class="step" x="44" y="145">01 | INPUTS</text>
      <text class="card-title" x="44" y="177">Conversation</text>
      <text class="card-title" x="44" y="203">sources</text>
      <text class="body" x="44" y="232">Claude Code</text>
      <text class="body" x="44" y="254">Codex</text>
      <text class="body" x="44" y="276">both read-only</text>
      <text class="body" x="44" y="298">ChatGPT JSON</text>
      <text class="body" x="44" y="320">explicit import</text>
    </g>
    <g>
      <rect x="264" y="110" width="196" height="224" rx="18" fill="#FFFFFF" stroke="#CFDCEB" stroke-width="1.5"/>
      <rect x="264" y="110" width="196" height="7" rx="3.5" fill="#3A8E92"/>
      <text class="step" x="284" y="145">02 | PRESERVE</text>
      <text class="card-title" x="284" y="177">SQLite</text>
      <text class="card-title" x="284" y="203">evidence store</text>
      <text class="body" x="284" y="237">Speaker and date</text>
      <text class="body" x="284" y="264">Text revisions</text>
      <text class="body" x="284" y="291">Source locations</text>
    </g>
    <g>
      <rect x="504" y="110" width="196" height="224" rx="18" fill="#FFFFFF" stroke="#CFDCEB" stroke-width="1.5"/>
      <rect x="504" y="110" width="196" height="7" rx="3.5" fill="#7766B4"/>
      <text class="step" x="524" y="145">03 | SEARCH</text>
      <text class="card-title" x="524" y="177">Search</text>
      <text class="body" x="524" y="215">Keyword search</text>
      <text class="body" x="524" y="244">Word-based</text>
      <text class="body" x="524" y="267">vectors</text>
      <text class="body" x="524" y="296">Combine both</text>
    </g>
    <g>
      <rect x="744" y="110" width="196" height="224" rx="18" fill="#FFFFFF" stroke="#CFDCEB" stroke-width="1.5"/>
      <rect x="744" y="110" width="196" height="7" rx="3.5" fill="#D18A42"/>
      <text class="step" x="764" y="145">04 | FIT</text>
      <text class="card-title" x="764" y="177">Fit to a</text>
      <text class="card-title" x="764" y="203">size limit</text>
      <text class="body" x="764" y="237">Whole passages</text>
      <text class="body" x="764" y="264">Original citations</text>
      <text class="body" x="764" y="291">Chosen size limit</text>
    </g>
    <g>
      <rect x="984" y="110" width="192" height="224" rx="18" fill="#FFFFFF" stroke="#CFDCEB" stroke-width="1.5"/>
      <rect x="984" y="110" width="192" height="7" rx="3.5" fill="#39816A"/>
      <text class="step" x="1004" y="145">05 | INSPECT</text>
      <text class="card-title" x="1004" y="177">Cited results</text>
      <text class="body" x="1004" y="215">Original passages</text>
      <text class="body" x="1004" y="244">Source citation</text>
      <text class="body" x="1004" y="273">Ready to inspect</text>
    </g>
  </g>
  <text class="sans foot" x="40" y="369">Each result points back to the original conversation passage.</text>
</svg>
